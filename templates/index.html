<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>냉장고 재료 인식</title>
<style>
  :root {
    --bg: #eef1f8;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #8a8fa3;
    --border: #eceef5;
    --blue-1: #6ec6ff;
    --blue-2: #4f8ef7;
    --shadow: 0 10px 28px rgba(31, 41, 66, 0.08);
    --shadow-sm: 0 4px 14px rgba(31, 41, 66, 0.06);
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 32px 20px 80px;
  }

  .page { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  .topbar {
    background: var(--card);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  .brand { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; letter-spacing: -2px; }
  .brand .logo { width: 32px; height: 32px; object-fit: contain; }

  .card {
    background: var(--card);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 24px;
  }

  .card-title { font-size: 17px; font-weight: 700; margin: 0 0 16px; display: flex; align-items: center; gap: 8px; }
  .card-title-icon { width: 24px; height: 24px; stroke: #4a4f5c; flex-shrink: 0; }

  input[type="text"] {
    font-family: inherit;
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #f8f9fd;
    color: var(--text);
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--blue-2); background: #fff; }

  #imageInput { display: none; }
  .file-drop {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    height: 200px;
    border: 2px dotted var(--blue-2);
    border-radius: 14px;
    background: #f8f9fd;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    cursor: pointer;
    transition: background-color 0.15s ease;
    overflow: hidden;
  }
  .file-drop:hover { background-color: #eaf2ff; }
  .file-drop .file-drop-icon { width: 36px; height: 36px; stroke: var(--muted); opacity: 0.7; }
  .file-drop.has-image { height: auto; display: block; padding: 0; }
  .file-drop.has-image .file-drop-icon { display: none; }
  .file-drop .file-drop-preview { display: none; width: 100%; height: auto; }
  .file-drop.has-image .file-drop-preview { display: block; }
  .file-drop .file-drop-text { font-size: 13px; text-align: center; }
  .file-drop.has-image .file-drop-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255, 255, 255, 0.85);
    padding: 6px 14px;
    border-radius: 999px;
    white-space: nowrap;
    opacity: 1;
    transition: opacity 1s ease;
  }
  .file-drop.has-image .file-drop-text.fade-out {
    opacity: 0;
  }

  button, .btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, var(--blue-1), var(--blue-2));
    color: #fff;
    box-shadow: 0 6px 16px rgba(79, 142, 247, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  button:hover:not(:disabled), .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(79, 142, 247, 0.42); }
  button:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; }

  .upload-actions { display: flex; gap: 10px; }
  .upload-actions button, .upload-actions .btn { flex: 1; }

  #logoutBtn, .btn-outline {
    background: #f1f3f9;
    color: var(--text);
    box-shadow: none;
  }
  #logoutBtn { padding-left: 10px; padding-right: 10px; font-size: 13px; font-weight: 400; }
  #logoutBtn:hover, .btn-outline:hover { box-shadow: none; background: #e7eaf3; }

  #recognizeBtn, #recipeBtn { padding: 16px 20px; }
  #recipeBtn { width: 100%; }

  #status, #recipeStatus, #savedListStatus { margin-top: 12px; font-size: 13px; color: var(--muted); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .chip {
    background: #eaf2ff;
    color: #2b6cb0;
    border-radius: 999px;
    padding: 7px 8px 7px 14px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .chip:nth-child(4n+2) { background: #e9f9f0; color: #1f9d55; }
  .chip:nth-child(4n+3) { background: #f1ecff; color: #7c3aed; }
  .chip:nth-child(4n+4) { background: #fff3e0; color: #d97706; }
  .chip button {
    background: rgba(0,0,0,0.08);
    border: none;
    color: inherit;
    padding: 0;
    width: 18px;
    height: 18px;
    border-radius: 999px;
    font-size: 11px;
    line-height: 1;
    box-shadow: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .chip button:hover { transform: none; box-shadow: none; background: rgba(0,0,0,0.15); }

  .add-row { display: flex; gap: 8px; margin-top: 14px; }
  .add-row input { flex: 1; }

  #recipes { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
  .recipe-card {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
    background: #fbfcff;
    opacity: 1;
    transition: opacity 0.6s ease;
  }
  .recipe-card.card-fade-out { opacity: 0; }
  .save-toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255, 255, 255, 0.95);
    color: var(--text);
    font-size: 14px;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 999px;
    box-shadow: var(--shadow-sm);
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .save-toast.show { opacity: 1; }
  .recipe-card h3 { margin: 0 0 10px; font-size: 16px; }
  .recipe-card .meta {
    font-size: 12px;
    color: #4f8ef7;
    background: #eaf2ff;
    display: inline-block;
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 12px;
    font-weight: 600;
  }
  .recipe-card ol { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.7; color: #454b5c; }
  .footer { font-size: 13px; text-align: center; color: var(--muted); margin-top: 12px; }
  .recipe-card .actions { margin-top: 14px; }
  .recipe-card .actions button {
    width: 100%;
    padding: 10px 16px;
    font-size: 13px;
    background: #f1f3f9;
    color: var(--text);
    box-shadow: none;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .recipe-card .actions button:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--blue-1), var(--blue-2));
    color: #fff;
    box-shadow: none;
    transform: none;
  }

  .profile-box { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #profileForm { display: flex; gap: 8px; flex-wrap: wrap; }
  #profileForm input { width: 140px; flex: 1 1 140px; }
  #profileStatus { font-size: 13px; color: var(--muted); }

  #savedList { margin-top: 8px; }
  .login-required {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 120px;
    background-color: #f8f8f8;
    border: 1px solid #ddd;
    border-radius: 14px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }
  .saved-item {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    font-size: 14px;
    background: #f8f9fd;
    border-radius: 14px;
    margin-bottom: 8px;
  }
  .saved-item .title {
    cursor: pointer;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
    margin-right: 28px;
  }
  .saved-item .title-text {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .saved-item .title-time {
    font-weight: 300;
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  .saved-item .title:hover .title-text { color: var(--blue-2); }
  .saved-item button {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 22px;
    height: 22px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    line-height: 1;
    background: transparent;
    color: var(--muted);
    box-shadow: none;
  }
  .saved-item button:hover { box-shadow: none; background: #ffe1e3; color: #e0455a; }

  #savedDetail {
    margin-top: 12px;
    font-size: 13px;
    white-space: pre-wrap;
    background: #f8f9fd;
    padding: 16px;
    border-radius: 16px;
    display: none;
    line-height: 1.6;
  }

  @media (max-width: 640px) {
    body { padding: 16px 12px 60px; }
    .page { gap: 14px; }

    .topbar { flex-direction: column; align-items: stretch; padding: 16px; border-radius: 18px; }
    .topbar.is-logged-in { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: nowrap; }
    .brand { font-size: 16px; }

    .topbar.is-logged-in .profile-box { width: auto; flex-direction: row; align-items: center; gap: 10px; flex-shrink: 0; flex-wrap: nowrap; }
    .profile-box { width: 100%; flex-direction: column; align-items: stretch; gap: 8px; }
    #profileForm { flex-direction: column; gap: 0; }
    #profileForm input { width: 100%; flex: none; margin-top: 10px; }
    #profileForm button, #logoutBtn { width: 100%; margin-top: 10px; }
    .topbar.is-logged-in #logoutBtn { width: auto; margin-top: 0; }

    .card { padding: 16px; border-radius: 18px; }
    .card-title { font-size: 15px; }

    input[type="file"] { width: 100%; }
    #recognizeBtn { width: 100%; }
    #recipeBtn { width: 100%; }

    .add-row button { flex-shrink: 0; }

    .recipe-card { padding: 14px; }
    .recipe-card .actions button { width: 100%; }

    .saved-item { flex-direction: column; align-items: flex-start; gap: 8px; }
    .saved-item .title { margin-right: 28px; }
    .saved-item .title-text {
      word-break: break-word;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
    }
  }
</style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand"><img class="logo" src="{{ url_for('static', filename='logo.png') }}" alt="냉장고 레시피 로고"> 냉장고 레시피</div>
      <div class="profile-box" id="profileBox">
        <div id="profileForm">
          <input type="text" id="emailInput" placeholder="이메일">
          <input type="text" id="nicknameInput" placeholder="닉네임">
          <button id="profileBtn">프로필 생성/로그인</button>
        </div>
        <div id="profileStatus"></div>
        <button id="logoutBtn" style="display: none;">로그아웃</button>
      </div>
    </header>

    <section class="card">
      <h2 class="card-title">
        <svg class="card-title-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z"></path>
          <circle cx="12" cy="13" r="3.5"></circle>
        </svg>
        냉장고 사진으로 재료 인식하기
      </h2>
      <label class="file-drop" for="imageInput" id="fileDropLabel">
        <svg class="file-drop-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <path d="M21 15l-5-5L5 21"></path>
        </svg>
        <span class="file-drop-text">사진을 선택하려면 클릭하세요</span>
        <img class="file-drop-preview" id="fileDropPreview" alt="">
      </label>
      <input type="file" id="imageInput" accept="image/*">
      <div class="upload-actions" style="margin-top: 14px;">
        <button id="recognizeBtn">재료 인식하기</button>
        <label class="btn btn-outline" for="imageInput" id="reuploadBtn" style="display: none;">사진 재업로드</label>
      </div>
      <div id="status"></div>

      <div class="chips" id="chips"></div>
      <div class="add-row">
        <input type="text" id="newIngredient" placeholder="재료 직접 추가">
        <button id="addBtn" class="btn-outline">추가</button>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">
        <svg class="card-title-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 10a4 4 0 0 1 2.2-3.58A4.5 4.5 0 0 1 12 3a4.5 4.5 0 0 1 3.8 3.42A4 4 0 0 1 18 10c0 3-1 5-1 7H7c0-2-1-4-1-7Z"></path>
          <path d="M7 17h10v2a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1v-2Z"></path>
        </svg>
        레시피 추천
      </h2>
      <button id="recipeBtn">레시피 추천받기</button>
      <div id="recipeStatus"></div>
      <div id="recipes"></div>
    </section>

    <section class="card">
      <h2 class="card-title">
        <svg class="card-title-icon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2.5l2.9 5.88 6.49.94-4.7 4.58 1.11 6.47L12 17.27l-5.8 3.1 1.11-6.47-4.7-4.58 6.49-.94L12 2.5z"></path>
        </svg>
        내 레시피
      </h2>
      <div class="login-required" id="loginRequired">로그인 하시면 내 레시피를 저장 하실 수 있습니다</div>
      <div id="savedListStatus"></div>
      <div id="savedList"></div>
      <div id="savedDetail"></div>
    </section>

    <footer class="footer">© 2026 냉장고 레시피. All rights reserved.</footer>
  </div>

<script>
const imageInput = document.getElementById("imageInput");
const fileDropLabel = document.getElementById("fileDropLabel");
const fileDropText = fileDropLabel.querySelector(".file-drop-text");
const fileDropPreview = document.getElementById("fileDropPreview");
const reuploadBtn = document.getElementById("reuploadBtn");
const recognizeBtn = document.getElementById("recognizeBtn");
const statusEl = document.getElementById("status");
const chipsEl = document.getElementById("chips");
const newIngredientInput = document.getElementById("newIngredient");
const addBtn = document.getElementById("addBtn");

let ingredients = [];

imageInput.addEventListener("change", () => {
  const file = imageInput.files[0];
  if (!file) return;
  fileDropText.textContent = `${file.name}가 업로드 됐습니다`;
  fileDropText.style.display = "";
  fileDropText.classList.remove("fade-out");
  fileDropPreview.src = URL.createObjectURL(file);
  fileDropLabel.classList.add("has-image");
  reuploadBtn.style.display = "";
  setTimeout(() => { fileDropText.classList.add("fade-out"); }, 2000);
});

function renderChips() {
  chipsEl.innerHTML = "";
  ingredients.forEach((name, idx) => {
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.textContent = name;
    const removeBtn = document.createElement("button");
    removeBtn.textContent = "✕";
    removeBtn.addEventListener("click", () => {
      ingredients.splice(idx, 1);
      renderChips();
    });
    chip.appendChild(removeBtn);
    chipsEl.appendChild(chip);
  });
}

addBtn.addEventListener("click", () => {
  const value = newIngredientInput.value.trim();
  if (!value) return;
  ingredients.push(value);
  newIngredientInput.value = "";
  renderChips();
});

recognizeBtn.addEventListener("click", async () => {
  const file = imageInput.files[0];
  if (!file) {
    statusEl.textContent = "이미지를 먼저 선택해주세요.";
    return;
  }

  recognizeBtn.disabled = true;
  statusEl.textContent = "인식 중... (최대 수십 초 소요될 수 있어요)";

  const formData = new FormData();
  formData.append("image", file);

  try {
    const res = await fetch("/api/recognize-ingredients", { method: "POST", body: formData });
    const data = await res.json();

    if (!res.ok) {
      statusEl.textContent = "오류: " + (data.error || "알 수 없는 오류");
      return;
    }

    ingredients = data.ingredients || [];
    renderChips();
    statusEl.textContent = `${ingredients.length}개 재료를 인식했습니다. 필요하면 수정하세요.`;
  } catch (e) {
    statusEl.textContent = "요청 실패: " + e.message;
  } finally {
    recognizeBtn.disabled = false;
  }
});

const recipeBtn = document.getElementById("recipeBtn");
const recipeStatusEl = document.getElementById("recipeStatus");
const recipesEl = document.getElementById("recipes");

let currentUser = null; // { user_id, email, nickname }

function stripStepNumber(step) {
  return String(step).replace(/^\s*\d+\s*[.)]\s*/, "");
}

function renderRecipes(recipes) {
  recipesEl.innerHTML = "";
  recipes.forEach((r) => {
    const card = document.createElement("div");
    card.className = "recipe-card";

    const title = document.createElement("h3");
    title.textContent = r.title;
    card.appendChild(title);

    const meta = document.createElement("div");
    meta.className = "meta";
    const additional = (r.additional_ingredients || []).join(", ") || "없음";
    meta.textContent = `예상 시간: ${r.estimated_time_minutes}분 · 추가 필요 재료: ${additional}`;
    card.appendChild(meta);

    const steps = document.createElement("ol");
    (r.steps || []).forEach((step) => {
      const li = document.createElement("li");
      li.textContent = stripStepNumber(step);
      steps.appendChild(li);
    });
    card.appendChild(steps);

    const actions = document.createElement("div");
    actions.className = "actions";
    const saveBtn = document.createElement("button");
    saveBtn.textContent = "저장";
    saveBtn.addEventListener("click", async () => {
      if (!currentUser) {
        alert("먼저 프로필을 생성/로그인해주세요.");
        return;
      }
      saveBtn.disabled = true;
      try {
        const res = await fetch("/api/recipes/save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_id: currentUser.user_id,
            title: r.title,
            used_ingredients: r.used_ingredients || [],
            additional_ingredients: r.additional_ingredients || [],
            steps: r.steps || [],
            estimated_time_minutes: r.estimated_time_minutes,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          alert("저장 실패: " + (data.error || "알 수 없는 오류"));
          return;
        }
        saveBtn.textContent = "저장됨";
        loadSavedList();

        const toast = document.createElement("div");
        toast.className = "save-toast";
        toast.textContent = "저장됐습니다";
        card.appendChild(toast);
        requestAnimationFrame(() => toast.classList.add("show"));

        setTimeout(() => {
          card.classList.add("card-fade-out");
        }, 800);
        setTimeout(() => {
          toast.classList.remove("show");
        }, 1400);
        card.addEventListener("transitionend", (e) => {
          if (e.propertyName === "opacity" && card.classList.contains("card-fade-out")) {
            card.remove();
          }
        });
      } catch (e) {
        alert("저장 실패: " + e.message);
      } finally {
        saveBtn.disabled = false;
      }
    });
    actions.appendChild(saveBtn);
    card.appendChild(actions);

    recipesEl.appendChild(card);
  });
}

recipeBtn.addEventListener("click", async () => {
  if (ingredients.length === 0) {
    recipeStatusEl.textContent = "재료를 먼저 인식하거나 직접 추가해주세요.";
    return;
  }

  recipeBtn.disabled = true;
  recipeStatusEl.textContent = "레시피 생성 중... (최대 수십 초 소요될 수 있어요)";
  recipesEl.innerHTML = "";

  try {
    const res = await fetch("/api/generate-recipes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ingredients }),
    });
    const data = await res.json();

    if (!res.ok) {
      recipeStatusEl.textContent = "오류: " + (data.error || "알 수 없는 오류");
      return;
    }

    renderRecipes(data.recipes || []);
    recipeStatusEl.textContent = `${(data.recipes || []).length}개 레시피를 추천받았습니다.`;
  } catch (e) {
    recipeStatusEl.textContent = "요청 실패: " + e.message;
  } finally {
    recipeBtn.disabled = false;
  }
});

const emailInput = document.getElementById("emailInput");
const nicknameInput = document.getElementById("nicknameInput");
const profileForm = document.getElementById("profileForm");
const profileBtn = document.getElementById("profileBtn");
const logoutBtn = document.getElementById("logoutBtn");
const profileStatusEl = document.getElementById("profileStatus");
const savedListStatusEl = document.getElementById("savedListStatus");
const savedListEl = document.getElementById("savedList");
const savedDetailEl = document.getElementById("savedDetail");
const loginRequiredEl = document.getElementById("loginRequired");

function setLoggedInUI(loggedIn) {
  profileForm.style.display = loggedIn ? "none" : "block";
  logoutBtn.style.display = loggedIn ? "inline-block" : "none";
  loginRequiredEl.style.display = loggedIn ? "none" : "flex";
  savedListStatusEl.style.display = loggedIn ? "" : "none";
  savedListEl.style.display = loggedIn ? "" : "none";
  document.querySelector(".topbar").classList.toggle("is-logged-in", loggedIn);
}

profileBtn.addEventListener("click", async () => {
  const email = emailInput.value.trim();
  const nickname = nicknameInput.value.trim();
  if (!email || !nickname) {
    profileStatusEl.textContent = "이메일과 닉네임을 모두 입력해주세요.";
    return;
  }

  profileBtn.disabled = true;
  try {
    const res = await fetch("/api/profile", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, nickname }),
    });
    const data = await res.json();
    if (!res.ok) {
      profileStatusEl.textContent = "오류: " + (data.error || "알 수 없는 오류");
      return;
    }
    currentUser = data;
    localStorage.setItem("fridge_user", JSON.stringify(data));
    profileStatusEl.textContent = `${data.nickname}님`;
    setLoggedInUI(true);
    loadSavedList();
  } catch (e) {
    profileStatusEl.textContent = "요청 실패: " + e.message;
  } finally {
    profileBtn.disabled = false;
  }
});

logoutBtn.addEventListener("click", () => {
  currentUser = null;
  localStorage.removeItem("fridge_user");
  emailInput.value = "";
  nicknameInput.value = "";
  profileStatusEl.textContent = "";
  setLoggedInUI(false);
  savedListEl.innerHTML = "";
  savedListStatusEl.textContent = "";
  savedDetailEl.style.display = "none";

  imageInput.value = "";
  fileDropText.textContent = "사진을 선택하려면 클릭하세요";
  fileDropPreview.src = "";
  fileDropLabel.classList.remove("has-image");
  reuploadBtn.style.display = "none";
  statusEl.textContent = "";
  ingredients = [];
  renderChips();

  recipesEl.innerHTML = "";
  recipeStatusEl.textContent = "";
});

async function loadSavedList() {
  if (!currentUser) return;
  savedListStatusEl.textContent = "불러오는 중...";
  savedDetailEl.style.display = "none";

  try {
    const res = await fetch(`/api/recipes/saved?user_id=${currentUser.user_id}`);
    const data = await res.json();
    if (!res.ok) {
      savedListStatusEl.textContent = "오류: " + (data.error || "알 수 없는 오류");
      return;
    }
    renderSavedList(data.recipes || []);
    savedListStatusEl.textContent = data.recipes.length ? "" : "저장된 레시피가 없습니다.";
  } catch (e) {
    savedListStatusEl.textContent = "요청 실패: " + e.message;
  }
}

function renderSavedList(recipes) {
  savedListEl.innerHTML = "";
  recipes.forEach((r) => {
    const row = document.createElement("div");
    row.className = "saved-item";

    const title = document.createElement("div");
    title.className = "title";
    title.addEventListener("click", () => showSavedDetail(r.id));

    const titleText = document.createElement("span");
    titleText.className = "title-text";
    titleText.textContent = r.title;
    title.appendChild(titleText);

    const titleTime = document.createElement("span");
    titleTime.className = "title-time";
    titleTime.textContent = new Date(r.created_at).toLocaleString();
    title.appendChild(titleTime);

    row.appendChild(title);

    const delBtn = document.createElement("button");
    delBtn.textContent = "×";
    delBtn.setAttribute("aria-label", "삭제");
    delBtn.addEventListener("click", async () => {
      if (!confirm("이 레시피를 삭제할까요?")) return;
      const res = await fetch(
        `/api/recipes/saved/${r.id}?user_id=${currentUser.user_id}`,
        { method: "DELETE" }
      );
      const data = await res.json();
      if (!res.ok) {
        alert("삭제 실패: " + (data.error || "알 수 없는 오류"));
        return;
      }
      loadSavedList();
    });
    row.appendChild(delBtn);

    savedListEl.appendChild(row);
  });
}

async function showSavedDetail(id) {
  const res = await fetch(`/api/recipes/saved/${id}`);
  const data = await res.json();
  if (!res.ok) {
    alert("조회 실패: " + (data.error || "알 수 없는 오류"));
    return;
  }
  const stepsText = (data.steps || [])
    .map((s, i) => `${i + 1}. ${stripStepNumber(s)}`)
    .join("\n");
  savedDetailEl.textContent =
    `[${data.title}] 예상 시간: ${data.estimated_time_minutes}분\n` +
    `사용 재료: ${(data.used_ingredients || []).join(", ")}\n` +
    `추가 재료: ${(data.additional_ingredients || []).join(", ")}\n\n${stepsText}`;
  savedDetailEl.style.display = "block";
}

// 페이지 로드 시 이전 로그인 정보 복원
(() => {
  const saved = localStorage.getItem("fridge_user");
  if (saved) {
    currentUser = JSON.parse(saved);
    emailInput.value = currentUser.email;
    nicknameInput.value = currentUser.nickname;
    profileStatusEl.textContent = `${currentUser.nickname}님`;
    setLoggedInUI(true);
    loadSavedList();
  } else {
    setLoggedInUI(false);
  }
})();
</script>
</body>
</html>
